name: oposaketia
services:
  web:
    image: docker.io/library/nginx:stable-alpine
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runner
    environment:
      DATABASE_URL: "postgresql://oposaketia:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in docker/.env}@db:5432/oposaketia"
      DEMO_MODE: "${DEMO_MODE:-false}"
    depends_on:
      db:
        condition: service_healthy
    # La comprobación exige que init haya creado el catálogo en PostgreSQL.
    healthcheck:
      test: ["CMD-SHELL", "node healthcheck.cjs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: oposaketia
      POSTGRES_USER: oposaketia
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in docker/.env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oposaketia -d oposaketia"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  init:
    image: oposaketia-importer:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: importer
    environment:
      DATABASE_URL: "postgresql://oposaketia:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in docker/.env}@db:5432/oposaketia"
      DEMO_MODE: "${DEMO_MODE:-false}"
    command: ["sh", "-c", "if [ \"$$DEMO_MODE\" = true ]; then npm run db:import -- data/demo.json; else npm run db:import -- data/empty.json; fi"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  updater:
    image: oposaketia-importer:local
    profiles: ["import"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: importer
    environment:
      DATABASE_URL: "postgresql://oposaketia:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in docker/.env}@db:5432/oposaketia"
      DEMO_MODE: "${DEMO_MODE:-false}"
      CATALOGUE_FILE: /imports/catalogue.json
      IMPORT_INTERVAL_SECONDS: "${IMPORT_INTERVAL_SECONDS:-21600}"
    volumes:
      - ../data/imports:/imports:ro,Z
    command: ["npm", "run", "worker"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  scraper:
    image: oposaketia-importer:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: importer
    environment:
      DATABASE_URL: "postgresql://oposaketia:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in docker/.env}@db:5432/oposaketia"
      DEMO_MODE: "false"
      SCRAPE_SOURCES: "euskadi,eitb,araba,donostia,ehu,ivap,osakidetza,euskotren,vitoria,lanbide,navarra,cdg64"
      SCRAPE_INTERVAL_SECONDS: "${SCRAPE_INTERVAL_SECONDS:-21600}"
    volumes:
      - scrape_exports:/app/data/imports
      - scrape_cache:/app/data/scrape-cache
    command: ["npm", "run", "scrape:worker"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  scrape_exports:
  scrape_cache:
